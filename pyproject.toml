[build-system]
requires = ["scikit-build-core>=0.12"]
build-backend = "scikit_build_core.build"

[project]
name = "fastmap"
version = "0.1.0"
description = "Signal processing and graph decoding with a C++ backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5"]

[tool.scikit-build]
cmake.source-dir = "cpp"
cmake.build-type = "Release"
wheel.packages = ["src/fastmap"]
wheel.py-api = "py3"